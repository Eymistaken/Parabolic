name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version name, e.g. 1.2.0"
        type: string
        required: true
      build-number:
        description: "Monotonic version code"
        type: string
        required: true
      release:
        description: "Require the release keystore"
        type: boolean
        default: false
    outputs:
      release-signed:
        description: "Whether the APKs carry the release key rather than a throwaway debug key"
        value: ${{ jobs.build.outputs.release-signed }}


jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release-signed: ${{ steps.signing.outputs.release-signed }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.build-number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${{ github.run_number }}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ inputs.release }}" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Release APKs must be signed with the release key, otherwise users cannot update."
              exit 1
            fi
            echo "::warning::No release keystore in secrets; this build is signed with a throwaway debug key."
            echo "release-signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release-signed=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=../release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties

      # :app is the Material 3 Expressive build; :legacy is the plain Material 3
      # build for older Android versions (Android 11 and below).
      - name: Build release APKs
        run: |
          ./gradlew :app:assembleRelease :legacy:assembleRelease --stacktrace \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION="${{ steps.version.outputs.name }}"
          VERSION="${VERSION%%+*}"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$apk" "$GITHUB_WORKSPACE/dist/Parabolic-${VERSION}-android-${abi}.apk"
          done
          for apk in legacy/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^legacy-//; s/-release(-unsigned)?$//')
            cp "$apk" "$GITHUB_WORKSPACE/dist/Parabolic-${VERSION}-android-legacy-${abi}.apk"
          done
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
